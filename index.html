<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Combate!</title>
    <style>
        body {
            background-color: #000; 
            color: #fff;
            font-family: sans-serif; 
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000; 
        }
        canvas {
            background-color: transparent;
            image-rendering: pixelated; 
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 400 / 700;
        }

        /* --- TELA INICIAL (START SCREEN) --- */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .game-title {
            font-size: 50px;
            font-weight: 900;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .combat-symbol {
            margin-bottom: 20px;
        }
        .btn-start {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }
        .btn-start:active { transform: translateY(3px) scale(0.95); }

        /* --- MENSAGENS CENTRAIS --- */
        #center-modal {
            position: absolute;
            top: 15%; 
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; 
            flex-direction: column;
            align-items: center;
            pointer-events: none; 
            z-index: 20;
            width: 90%;
            max-width: 380px;
        }
        .modal-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 1.4;
            backdrop-filter: blur(4px);
        }
        #btn-action {
            pointer-events: auto; 
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: transform 0.1s;
        }
        #btn-action:active { transform: translateY(3px) scale(0.95); }

        /* --- DRAMA KILL MSG --- */
        #dramatic-kill {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px; 
            font-weight: 900;
            color: #ff3333;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #fff;
            display: none;
            z-index: 100;
            text-transform: uppercase;
            text-align: center;
            width: 90%;
            white-space: pre-wrap; 
            pointer-events: none;
            line-height: 1.2;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- BARRA INFERIOR MINIMALISTA --- */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 240px; 
            background: rgba(15, 15, 15, 0.98);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: none; 
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            z-index: 30;
        }

        .row-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        #status-text {
            font-size: 14px;
            color: #ddd;
            font-weight: bold;
        }

        .minimal-btn {
            pointer-events: auto;
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 20px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .minimal-btn.active { background: white; color: black; border-color: white; }
        .minimal-btn.danger { color: #ff5555; border-color: rgba(255,85,85,0.4); }
        .minimal-btn.danger:active { background: #ff5555; color: white; }

        /* --- VIRTUAL JOYSTICK --- */
        #joystick-zone {
            display: none; 
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            margin-top: 5px;
        }
        #joystick-knob {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 30px; 
            left: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out; 
        }
        #joy-cancel {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff5555;
            font-weight: bold;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 10px;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="combat-symbol">
            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round">
                <circle cx="50" cy="50" r="40"/>
                <line x1="50" y1="0" x2="50" y2="25"/>
                <line x1="50" y1="100" x2="50" y2="75"/>
                <line x1="0" y1="50" x2="25" y2="50"/>
                <line x1="100" y1="50" x2="75" y2="50"/>
                <circle cx="50" cy="50" r="5" fill="#d4af37"/>
            </svg>
        </div>
        <div class="game-title">COMBATE!</div>
        <button class="btn-start" onclick="initGame()">INICIAR JOGO</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div id="dramatic-kill">ELIMINADO!</div>

        <div id="center-modal">
            <div class="modal-box" id="modal-text">Desenhe o terreno com o dedo da esquerda para a direita</div>
            <button id="btn-action" onclick="nextPhase()">Pronto</button>
        </div>

        <div id="bottom-bar">
            <div class="row-ui">
                <span id="status-text">Terreno</span>
                <button class="minimal-btn danger" onclick="showStartScreen()">Sair</button>
            </div>
            
            <div class="row-ui" id="action-area" style="display:none;">
                <div style="display: flex; gap: 10px;">
                    <button id="btn-shoot" class="minimal-btn active" onclick="setAction('SHOOT')">Atirar</button>
                    <button id="btn-jump" class="minimal-btn" onclick="setAction('JUMP')">Pular</button>
                </div>
                <button class="minimal-btn" onclick="toggleScreen()">Alternar Tela</button>
            </div>
            
            <div id="joystick-zone">
                <div id="joy-cancel">CANCELAR</div>
                <div id="joystick-knob"></div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const centerModal = document.getElementById('center-modal');
    const modalText = document.getElementById('modal-text');
    const btnAction = document.getElementById('btn-action');
    const bottomBar = document.getElementById('bottom-bar');
    const statusText = document.getElementById('status-text');
    const actionArea = document.getElementById('action-area');
    const btnShoot = document.getElementById('btn-shoot');
    const btnJump = document.getElementById('btn-jump');
    const dramaticKill = document.getElementById('dramatic-kill');
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const joyCancel = document.getElementById('joy-cancel');

    const BGS = ['assets/img/fundo.png', 'assets/img/fundo2.png', 'assets/img/fundo3.png', 'assets/img/fundo4.png'];
    const bgImage = new Image();
    let terrainColor = '#1c5e20'; 
    
    const ALL_NAMES = [
        "Morg", "Vitor", "Wagner", "V", "CAP", "Cleber", "nomaR", "Will", "Coronel", 
        "Master", "DAI", "Lutika", "Drih", "Edson", "GUI Aranha", "Gabriel", "Fred", 
        "Lurmito", "Odyssay"
    ];

    const TAUNTS = [
        "HAHAHA, {name}!", "{name}, ERROU!", "{name}, VC É RUIM!", "FRACO, {name}!", 
        "{name}, NUNCA ME PEGARÁ!", "PASSOU LONGE, {name}!", "{name} PRECISA DE ÓCULOS?", 
        "QUE MIRA HORRÍVEL, {name}!", "SÓ ISSO, {name}?", "{name}, TENTA DE NOVO!",
        "{name}, DEIXA QUE EU TE ENSINO!", "CHORA, {name}!", "FOI QUASE... MENTIRA, {name}!",
        "{name}, ATIRA IGUAL MINHA AVÓ!", "DESISTE, {name}!", "MIROU NO VENTO, {name}?",
        "{name}, TÁ COM MEDO?", "ESSE É O SEU MELHOR, {name}?", "{name}, NEM FEZ CÓCEGAS!",
        "VAI TREINAR, {name}!"
    ];

    const SCREEN_W = 400;
    const WORLD_W = 800;
    let cameraX = 0; 

    let gameState = 'START_SCREEN';
    let terrain;
    let players;
    let currentPlayerIndex;
    let matchNames = [];

    let actionsLeft = 2;
    let currentAction = 'SHOOT'; 
    let actionInProgress = false; 

    let isDraggingJoy = false;
    let isCancelingJoy = false;
    let joyAimDx = 0;
    let joyAimDy = 0;

    let isMouseDown = false;
    let lastMouseX = -1, lastMouseY = -1;
    
    let projectile = null;
    let explosions = [];
    let bloodPuddles = []; 
    let dyingPlayers = []; // Nova matriz para o grito de dor!
    let ghosts = []; 
    let victoryBots = []; 
    let activeBoxes = []; 
    let shotsUntilDrop = 5;

    let placedFriends = 0;
    let currentTrajectory = [];
    let savedTrajectory = [];
    let savedAim = null; 
    let audioCtx = null;

    // --- SISTEMA DE ÁUDIO ---
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPlaceSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playJumpSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function playShootSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }

    function playExplosionSound() {
        if (!audioCtx) return;
        let bufferSize = audioCtx.sampleRate * 0.8;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.8);
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
    }

    function playPowerupSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    function playGhostSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 1);
        osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 2.5);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 2.5);
    }

    function playVictorySound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        let now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(261.63, now); 
        osc.frequency.setValueAtTime(329.63, now + 0.15); 
        osc.frequency.setValueAtTime(392.00, now + 0.3); 
        osc.frequency.setValueAtTime(523.25, now + 0.45); 
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.setValueAtTime(0.3, now + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 1.2);
    }

    function forceFullScreen() {
        initAudio(); 
        let elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            let req = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
            if (req) req.call(elem).catch(() => {});
        }
    }

    function showDramaticMessage(text, color = '#ff3333') {
        dramaticKill.innerText = text;
        dramaticKill.style.color = color;
        dramaticKill.style.display = 'block';
        dramaticKill.style.animation = 'none';
        void dramaticKill.offsetWidth; 
        dramaticKill.style.animation = 'popIn 0.5s ease-out forwards';
        setTimeout(() => { dramaticKill.style.display = 'none'; }, 2500);
    }

    function toggleScreen() {
        forceFullScreen();
        cameraX = cameraX === 0 ? 400 : 0;
    }

    function showStartScreen() {
        gameState = 'START_SCREEN';
        startScreen.style.display = 'flex';
        centerModal.style.display = 'none';
        bottomBar.style.display = 'none';
        dramaticKill.style.display = 'none';
    }

    function initGame() {
        forceFullScreen();
        startScreen.style.display = 'none';
        bottomBar.style.display = 'flex';

        let currentBgSrc = BGS[Math.floor(Math.random() * BGS.length)];
        bgImage.src = currentBgSrc;
        if(currentBgSrc.includes('fundo2')) terrainColor = '#5c4033'; 
        else terrainColor = '#1c5e20'; 

        gameState = 'DRAWING';
        terrain = new Array(WORLD_W).fill(canvas.height - 350); 
        players = new Array(6).fill(null);
        currentPlayerIndex = 0;
        actionsLeft = 2;
        actionInProgress = false;
        isMouseDown = false;
        cameraX = 0; 
        
        projectile = null;
        explosions = [];
        bloodPuddles = [];
        dyingPlayers = [];
        ghosts = [];
        victoryBots = [];
        activeBoxes = [];
        shotsUntilDrop = 5;
        
        currentTrajectory = [];
        savedTrajectory = [];
        savedAim = null;
        placedFriends = 0;

        matchNames = [...ALL_NAMES].sort(() => 0.5 - Math.random()).slice(0, 6);

        centerModal.style.display = 'flex';
        modalText.innerHTML = "Desenhe o terreno com o dedo da esquerda para a direita";
        btnAction.style.display = 'inline-block';
        
        statusText.innerText = "Fase 1 - Terreno";
        actionArea.style.display = 'none';
        joystickZone.style.display = 'none';
        setAction('SHOOT');
    }

    function setAction(actionType) {
        forceFullScreen(); 
        if (gameState !== 'PLAYING' || players[currentPlayerIndex]?.team !== 0) return;
        currentAction = actionType;
        btnShoot.classList.toggle('active', actionType === 'SHOOT');
        btnJump.classList.toggle('active', actionType === 'JUMP');
        joystickZone.style.display = (actionType === 'SHOOT') ? 'block' : 'none';
    }

    function handleJoyStart(e) {
        if (gameState !== 'PLAYING' || currentAction !== 'SHOOT' || actionInProgress) return;
        isDraggingJoy = true;
        joystickKnob.style.transition = 'none';
        updateJoy(e);
    }

    function handleJoyMove(e) {
        if (!isDraggingJoy) return;
        e.preventDefault(); 
        updateJoy(e);
    }

    function handleJoyEnd(e) {
        if (!isDraggingJoy) return;
        isDraggingJoy = false;
        joystickKnob.style.transition = 'transform 0.1s ease-out';
        joystickKnob.style.transform = `translate(0px, 0px)`;
        joyCancel.style.display = 'none';
        
        let dist = Math.hypot(joyAimDx, joyAimDy);
        if (dist > 15 && !isCancelingJoy) {
            let rawDx = -joyAimDx * 3.5;
            let rawDy = -joyAimDy * 3.5;
            executeShoot(rawDx * 0.1, rawDy * 0.1, rawDx, rawDy);
        }
        
        joyAimDx = 0; joyAimDy = 0;
        isCancelingJoy = false;
    }

    function updateJoy(e) {
        let rect = joystickZone.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let dx = clientX - rect.left - 50;
        let dy = clientY - rect.top - 50;
        let dist = Math.hypot(dx, dy);
        let maxRadius = 50; 
        
        if (dist < 15) {
            isCancelingJoy = true;
            joyCancel.style.display = 'block';
        } else {
            isCancelingJoy = false;
            joyCancel.style.display = 'none';
        }

        if (dist > maxRadius) {
            dx = (dx / dist) * maxRadius;
            dy = (dy / dist) * maxRadius;
        }
        
        joyAimDx = dx; joyAimDy = dy;
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    joystickZone.addEventListener('mousedown', handleJoyStart);
    document.addEventListener('mousemove', handleJoyMove);
    document.addEventListener('mouseup', handleJoyEnd);
    joystickZone.addEventListener('touchstart', handleJoyStart, {passive: false});
    document.addEventListener('touchmove', handleJoyMove, {passive: false});
    document.addEventListener('touchend', handleJoyEnd, {passive: false});

    function spawnBoxes() {
        let type1 = Math.random() < 0.5 ? 'SUPERBOMBA' : 'VIDA';
        let type2 = Math.random() < 0.5 ? 'SUPERBOMBA' : 'VIDA';
        activeBoxes.push({ x: 50 + Math.random() * 300, y: -50, falling: true, type: type1 });
        activeBoxes.push({ x: 450 + Math.random() * 300, y: -50, falling: true, type: type2 });
    }

    function checkBoxCollision() {
        for (let i = activeBoxes.length - 1; i >= 0; i--) {
            let box = activeBoxes[i];
            if (box.falling) continue; 

            players.forEach(p => {
                if (p && p.alive && activeBoxes[i] === box) {
                    if (Math.hypot(p.x - box.x, p.y - box.y) < 20) {
                        openBox(p, i);
                    }
                }
            });
        }
    }

    function openBox(p, index) {
        let box = activeBoxes[index];
        let t = box.type;
        playPowerupSound();
        
        if (t === 'SUPERBOMBA') {
            if (p.team === players[currentPlayerIndex].team) {
                actionsLeft += 1;
                p.hasSuperBomb = true; 
                showDramaticMessage(`${p.name}\nPEGOU SUPERBOMBA!\n+1 Ação`, '#ffaa00');
            }
        } else if (t === 'VIDA') {
            let deadAllies = players.filter(ally => ally && ally.team === p.team && !ally.alive);
            if (deadAllies.length > 0) {
                let revived = deadAllies[Math.floor(Math.random() * deadAllies.length)];
                revived.alive = true;
                revived.x = box.x;
                revived.y = box.y - 5;
                revived.vx = 0; revived.vy = 0;
                showDramaticMessage(`${revived.name} REVIVEU!`, '#ffffaa');
            } else {
                showDramaticMessage(`CAIXA VAZIA...`, '#aaaaaa');
            }
        }
        
        explosions.push({ x: box.x, y: box.y, radius: 25, life: 25, type: 'sparkle' });
        activeBoxes.splice(index, 1);
        shotsUntilDrop = 3;
        updateStatusText();
    }

    function gameLoop() {
        if (gameState !== 'START_SCREEN') {
            update();
            draw();
        }
        requestAnimationFrame(gameLoop);
    }

    function update() {
        activeBoxes.forEach(box => {
            let groundY = terrain[Math.floor(box.x)];
            if (box.y < groundY - 8) { 
                box.y += 1.5; 
                box.falling = true;
            } else {
                box.y = groundY - 8;
                box.falling = false;
            }
        });

        // Atualiza a vida dos soldados morrendo (gritando)
        dyingPlayers.forEach(d => {
            d.life--;
            if (d.life <= 0) {
                playGhostSound();
                ghosts.push({ x: d.x, y: d.y - 10, life: 150, maxLife: 150 });
            }
        });
        dyingPlayers = dyingPlayers.filter(d => d.life > 0);

        ghosts.forEach(g => {
            g.y -= 1.5; 
            g.x += Math.sin(g.life * 0.1) * 0.5; 
            g.life--;
        });
        ghosts = ghosts.filter(g => g.life > 0);

        if (gameState === 'PLAYING') {
            checkBoxCollision();

            players.forEach(p => {
                if (p) {
                    if (p.taunt && p.taunt.life > 0) p.taunt.life--;
                    
                    if (p.alive) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.25; 
                        if (p.x < 5) p.x = 5;
                        if (p.x > WORLD_W - 5) p.x = WORLD_W - 5;

                        let groundY = terrain[Math.floor(p.x)];
                        if (p.y >= groundY) {
                            p.y = groundY;
                            p.vy = 0;
                            p.vx *= 0.5; 
                            if (Math.abs(p.vx) < 0.1) p.vx = 0; 
                        }
                    }
                }
            });

            if (projectile) {
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;
                projectile.vy += 0.15;
                
                if (projectile.x >= SCREEN_W && cameraX === 0) cameraX = 400;
                else if (projectile.x < SCREEN_W && cameraX === 400) cameraX = 0;

                currentTrajectory.push({x: projectile.x, y: projectile.y});

                if (Math.random() > 0.3) {
                    explosions.push({ x: projectile.x, y: projectile.y, radius: 2, life: 10, type: 'smoke' });
                }

                if (projectile.x < 0 || projectile.x > WORLD_W || projectile.y > canvas.height + 50) {
                    let shooterName = players[currentPlayerIndex] ? players[currentPlayerIndex].name : "Fantasma";
                    saveAndClearProjectile();
                    let hasTaunt = triggerMissTaunt(-100, -100, shooterName); 
                    setTimeout(finishAction, hasTaunt ? 4000 : 1000); 
                } 
                else if (projectile.y >= terrain[Math.floor(projectile.x)]) {
                    triggerExplosion(projectile.x, projectile.y, projectile.isSuper);
                    saveAndClearProjectile();
                }
            }

            explosions.forEach(exp => exp.life--);
            explosions = explosions.filter(exp => exp.life > 0);
        }

        if (gameState === 'GAME_OVER') {
            victoryBots.forEach(b => {
                b.y += b.vy;
                b.vy += 0.25; 
                if (b.y >= b.groundY) {
                    b.y = b.groundY;
                    b.vy = -3 - Math.random() * 3; 
                    playJumpSound(); 
                }
            });
        }
    }

    function triggerMissTaunt(ex, ey, shooterName) {
        let pTurn = players[currentPlayerIndex];
        if(!pTurn) return false;
        let enemies = players.filter(p => p && p.alive && p.team !== pTurn.team);
        
        if (enemies.length > 0) {
            enemies.sort((a,b) => Math.hypot(a.x - ex, a.y - ey) - Math.hypot(b.x - ex, b.y - ey));
            let closest = enemies[0];
            let msg = TAUNTS[Math.floor(Math.random() * TAUNTS.length)].replace(/\{name\}/g, shooterName);
            closest.taunt = { text: msg, life: 120 }; 
            return true;
        }
        return false;
    }

    function saveAndClearProjectile() {
        savedTrajectory = [...currentTrajectory];
        currentTrajectory = [];
        projectile = null;
    }

    function drawGhost(x, y, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha; 
        ctx.translate(x, y);
        ctx.fillStyle = 'rgba(220, 240, 255, 0.9)';
        ctx.fillRect(-8, -15, 16, 12);
        ctx.fillRect(-6, -18, 12, 3);
        ctx.fillRect(-8, -3, 4, 3);
        ctx.fillRect(-2, -3, 4, 3);
        ctx.fillRect(4, -3, 4, 3);
        ctx.fillStyle = 'black';
        ctx.fillRect(-5, -12, 2, 2);
        ctx.fillRect(3, -12, 2, 2);
        ctx.fillRect(-2, -8, 4, 4);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-cameraX, 0);

        if (bgImage.complete) ctx.drawImage(bgImage, 0, 0, WORLD_W, canvas.height);
        else { ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, WORLD_W, canvas.height); }

        bloodPuddles.forEach(b => {
            let gy = terrain[Math.floor(b.x)];
            ctx.fillStyle = 'rgba(150, 0, 0, 0.8)';
            ctx.fillRect(b.x - 15, gy - 2, 30, 4); 
        });

        ctx.fillStyle = terrainColor;
        ctx.beginPath(); ctx.moveTo(0, canvas.height);
        for (let x = 0; x < WORLD_W; x++) ctx.lineTo(x, terrain[x]);
        ctx.lineTo(WORLD_W, canvas.height); ctx.fill();
        
        activeBoxes.forEach(box => {
            ctx.save();
            ctx.translate(box.x, box.y);
            
            if (box.falling) {
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(-10, -25, 20, 7);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-10, -18); ctx.lineTo(-4, -8);
                ctx.moveTo(10, -18); ctx.lineTo(4, -8);
                ctx.stroke();
            }

            if (box.type === 'VIDA') ctx.fillStyle = (Math.floor(Date.now() / 150) % 2) ? '#ffffaa' : '#ffffff'; 
            else ctx.fillStyle = '#ffaa00';
            
            ctx.fillRect(-8, -8, 16, 16);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(-8, -8, 16, 16);
            ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let txt = box.type === 'VIDA' ? '❤' : 'S';
            ctx.fillText(txt, 0, 1);
            ctx.restore();
        });

        if (gameState === 'PLAYING' && !actionInProgress) {
            let p = players[currentPlayerIndex];
            if (p && p.team === 0) {
                if (savedTrajectory.length > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.lineWidth = 1; ctx.beginPath();
                    ctx.moveTo(savedTrajectory[0].x, savedTrajectory[0].y);
                    for(let i=1; i<savedTrajectory.length; i++) ctx.lineTo(savedTrajectory[i].x, savedTrajectory[i].y);
                    ctx.stroke();
                }

                if (savedAim && currentAction === 'SHOOT' && !isDraggingJoy) {
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath();
                    ctx.moveTo(p.x, p.y - 15);
                    ctx.lineTo(p.x + savedAim.dx, p.y - 15 + savedAim.dy);
                    ctx.stroke(); ctx.setLineDash([]);
                }
            }
        }

        players.forEach((p, index) => {
            if (!p || !p.alive) return;
            drawSoldier(p.x, p.y, p.team, (gameState === 'PLAYING' && index === currentPlayerIndex && !actionInProgress));
        });

        // Grito de Vingança
        dyingPlayers.forEach(d => {
            drawBalloon(d.x, d.y - 5, `VOU ME VINGAR,\n${d.killer.toUpperCase()}!`);
        });

        if (gameState === 'GAME_OVER') {
            victoryBots.forEach(b => {
                if (b.isGhost) drawGhost(b.x, b.y, 0.9);
                else drawSoldier(b.x, b.y, b.team, false);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(b.name, b.x, b.y - 30);
            });
        }

        ghosts.forEach(g => { drawGhost(g.x, g.y, (g.life / g.maxLife) * 0.8); });

        if (gameState === 'PLAYING' && isDraggingJoy && currentAction === 'SHOOT' && players[currentPlayerIndex].team === 0 && !actionInProgress && !isCancelingJoy) {
            let p = players[currentPlayerIndex];
            let aimColor = getAimColor(p, joyAimDx, joyAimDy);
            ctx.strokeStyle = aimColor; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(p.x, p.y - 15);
            ctx.lineTo(p.x + (-joyAimDx * 3.5), p.y - 15 + (-joyAimDy * 3.5)); ctx.stroke();
        }

        if (projectile) drawMissile(projectile.x, projectile.y, projectile.vx, projectile.vy);

        explosions.forEach(exp => {
            let r = exp.radius;
            if (exp.type === 'smoke') {
                ctx.fillStyle = `rgba(200, 200, 200, ${exp.life / 10})`;
                ctx.fillRect(exp.x - r, exp.y - r, r*2, r*2);
            } else if (exp.type === 'sparkle') {
                let sr = r * (1 - exp.life/25) + 10;
                ctx.fillStyle = `rgba(255, 255, 100, ${exp.life / 25})`;
                ctx.fillRect(exp.x - sr, exp.y - sr, sr*2, sr*2);
            } else {
                let er = r * (1 - exp.life/25) + 3;
                ctx.fillStyle = `rgba(255, ${80 + exp.life * 5}, 0, ${exp.life / 25})`;
                ctx.fillRect(exp.x - er, exp.y - er, er*2, er*2);
            }
        });

        players.forEach(p => {
            if (p && p.alive && p.taunt && p.taunt.life > 0) drawBalloon(p.x, p.y - 35, p.taunt.text);
        });

        drawNamesUI();
        ctx.restore();
    }

    function getAimColor(p, joyDx, joyDy) {
        let simX = p.x; let simY = p.y - 15;
        let simVx = (-joyDx * 3.5) * 0.1; let simVy = (-joyDy * 3.5) * 0.1;
        let steps = 0; let maxSteps = 400;

        while (steps < maxSteps) {
            simX += simVx; simY += simVy; simVy += 0.15; 
            if (simX < 0 || simX >= WORLD_W || simY > canvas.height + 50) return 'rgba(255, 51, 51, 0.9)'; 
            if (simY >= terrain[Math.floor(simX)]) {
                if (simX < SCREEN_W) return 'rgba(255, 51, 51, 0.9)'; 
                else return 'rgba(255, 255, 255, 0.9)'; 
            }
            steps++;
        }
        return 'rgba(255, 51, 51, 0.9)'; 
    }

    function drawBalloon(x, y, text) {
        ctx.save(); ctx.translate(x, y);
        ctx.font = "bold 12px 'Courier New', monospace";
        
        let lines = text.split('\n');
        if (lines.length === 1 && ctx.measureText(text).width > 120) {
            lines = [];
            let words = text.split(' ');
            let currentLine = '';
            for(let i=0; i<words.length; i++){
                let testLine = currentLine + words[i] + ' ';
                if(ctx.measureText(testLine).width > 120 && i > 0){
                    lines.push(currentLine.trim());
                    currentLine = words[i] + ' ';
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine.trim());
        }

        let lineHeight = 16; 
        let boxHeight = lines.length * lineHeight + 10;
        let maxWidth = Math.max(...lines.map(l => ctx.measureText(l).width));
        let w = maxWidth + 20; 
        
        ctx.fillStyle = "white"; 
        ctx.fillRect(-w/2, -boxHeight - 8, w, boxHeight); 
        ctx.fillRect(-2, -8, 4, 8); 
        
        ctx.fillStyle = "black"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        lines.forEach((line, i) => {
            let ly = -boxHeight - 8 + 5 + (i * lineHeight) + (lineHeight/2);
            ctx.fillText(line, 0, ly);
        });
        
        ctx.restore();
    }

    function drawNamesUI() {
        ctx.font = "bold 16px 'Courier New', monospace"; 
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        for(let i = 0; i < 3; i++) {
            let p = players[i * 2];
            if (p) { ctx.fillStyle = p.alive ? '#ffffff' : '#ff4444'; ctx.fillText(p.name, 60 + (i * 140), 20); }
        }
        for(let i = 0; i < 3; i++) {
            let p = players[i * 2 + 1];
            if (p) { ctx.fillStyle = p.alive ? '#ffffff' : '#ff4444'; ctx.fillText(p.name, 460 + (i * 140), 20); }
        }
    }

    function drawSoldier(x, y, team, isActive) {
        ctx.save(); ctx.translate(x, y);
        const helmetColor = team === 0 ? '#3cb371' : '#b33c3c';
        const bodyColor = team === 0 ? '#2e8b57' : '#8b2e2e';

        ctx.fillStyle = bodyColor; ctx.fillRect(-6, -12, 12, 12); 
        ctx.fillStyle = helmetColor; ctx.fillRect(-7, -15, 14, 5); ctx.fillRect(-4, -17, 8, 3); 
        ctx.fillStyle = '#ffdbac'; ctx.fillRect(-4, -10, 8, 5); 
        ctx.fillStyle = 'black'; ctx.fillRect(-2, -8, 1, 1); ctx.fillRect(1, -8, 1, 1); 
        ctx.fillStyle = '#444'; ctx.fillRect(team === 0 ? 3 : -7, -14, 4, 10); 

        if (players.find(p => p && p.x === x && p.y === y && p.hasSuperBomb)) {
            if (Math.floor(Date.now() / 150) % 2) {
                ctx.fillStyle = 'rgba(255, 165, 0, 0.5)'; ctx.fillRect(-8, -18, 16, 18);
            }
        }

        if (isActive && (Math.floor(Date.now() / 250) % 2)) {
            ctx.fillStyle = 'yellow'; ctx.beginPath();
            ctx.moveTo(0, -22); ctx.lineTo(4, -28); ctx.lineTo(-4, -28); ctx.fill(); 
        }
        ctx.restore();
    }

    function drawMissile(x, y, vx, vy) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(vy, vx));
        ctx.fillStyle = 'black'; ctx.fillRect(-6, -2, 12, 4);
        ctx.fillStyle = '#cc0000'; ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(10, 0); ctx.lineTo(6, 2); ctx.fill();
        ctx.fillStyle = '#666'; ctx.fillRect(-6, -4, 2, 8);
        ctx.restore();
    }

    function getEventPos(e) {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        return { x: ((clientX - rect.left) * scaleX) + cameraX, y: (clientY - rect.top) * scaleY };
    }

    function handleStart(e) {
        if (e.target.tagName === 'BUTTON' || e.target.id.includes('joy')) return; 
        
        forceFullScreen(); 
        let pos = getEventPos(e);

        if (gameState === 'DRAWING') {
            isMouseDown = true; lastMouseX = pos.x; lastMouseY = pos.y; drawTerrainAt(pos.x, pos.y);
        } else if (gameState === 'PLACING') {
            if (pos.x > 400) { modalText.innerHTML = "Toque na SUA Tela!"; return; }
            playPlaceSound();
            players[placedFriends * 2] = { name: matchNames[placedFriends], x: pos.x, y: terrain[Math.floor(pos.x)], vx: 0, vy: 0, team: 0, alive: true, taunt: null, hasSuperBomb: false };
            placedFriends++;
            
            if (placedFriends >= 3) { placeBots(); startCombat(); } 
            else { modalText.innerHTML = `Posicione seus soldados! (Restam ${3 - placedFriends})`; }
        } else if (gameState === 'PLAYING' && !actionInProgress) {
            let p = players[currentPlayerIndex];
            if (p.team === 0 && currentAction === 'JUMP') executeJump(pos.x > p.x ? 1 : -1);
        }
    }

    function handleMove(e) {
        if (!isMouseDown) return;
        let pos = getEventPos(e);
        if (gameState === 'DRAWING') {
            drawTerrainLine(lastMouseX, lastMouseY, pos.x, pos.y);
            lastMouseX = pos.x; lastMouseY = pos.y;
        }
    }

    function handleEnd(e) {
        isMouseDown = false; lastMouseX = -1;
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e) => { if(e.target.tagName !== 'BUTTON' && !e.target.id.includes('joy')) { e.preventDefault(); handleStart(e); } }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { if(e.target.tagName !== 'BUTTON' && !e.target.id.includes('joy')) { e.preventDefault(); handleMove(e); } }, {passive: false});
    canvas.addEventListener('touchend', (e) => { if(e.target.tagName !== 'BUTTON' && !e.target.id.includes('joy')) { e.preventDefault(); handleEnd(e); } }, {passive: false});

    function nextPhase() {
        forceFullScreen(); cameraX = 0; 
        if (gameState === 'DRAWING') {
            gameState = 'PLACING';
            modalText.innerHTML = "Posicione seus 3 soldados!";
            btnAction.style.display = 'none';
        }
    }

    function placeBots() {
        for (let i = 0; i < 3; i++) {
            let bx = 450 + (i * 100) + Math.random() * 80;
            players[i * 2 + 1] = { name: matchNames[3 + i], x: bx, y: terrain[Math.floor(bx)], vx: 0, vy: 0, team: 1, alive: true, taunt: null, hasSuperBomb: false };
        }
    }

    function startCombat() {
        gameState = 'PLAYING'; currentPlayerIndex = 0;
        centerModal.style.display = 'none'; 
        startPlayerTurn();
    }

    function resetGame() {
        forceFullScreen(); 
        ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        setTimeout(initGame, 50);
    }

    function startPlayerTurn() {
        actionsLeft = 2; actionInProgress = false;
        savedTrajectory = []; savedAim = null;      
        let p = players[currentPlayerIndex];
        
        cameraX = (p.x < SCREEN_W) ? 0 : 400;

        if (p.team === 0) { actionArea.style.display = 'flex'; setAction('SHOOT'); } 
        else {
            actionArea.style.display = 'none'; joystickZone.style.display = 'none';
            setTimeout(botAI, 1000);
        }
        updateStatusText();
    }

    function updateStatusText() {
        if (gameState !== 'PLAYING') return;
        let p = players[currentPlayerIndex];
        statusText.innerText = `Turno: ${p.name} (${actionsLeft} Ações)`;
    }

    function executeJump(direction) {
        actionInProgress = true; savedTrajectory = []; savedAim = null;
        let p = players[currentPlayerIndex];
        playJumpSound();
        p.vy = -3.5; p.vx = direction * 1.5; 
        for(let i=0; i<4; i++) explosions.push({ x: p.x, y: p.y, radius: 2, life: 10, type: 'smoke' });
        setTimeout(finishAction, 800); 
    }

    function executeShoot(vx, vy, rawDx, rawDy) {
        actionInProgress = true; currentTrajectory = []; 
        savedAim = { dx: rawDx, dy: rawDy }; 
        let p = players[currentPlayerIndex];
        
        let isSuper = p.hasSuperBomb; p.hasSuperBomb = false; 
        projectile = { x: p.x, y: p.y - 15, vx: vx, vy: vy, isSuper: isSuper };
        
        playShootSound(); 
        for(let i=0; i<5; i++) explosions.push({ x: p.x + (Math.random()-0.5)*10, y: p.y - 15 + (Math.random()-0.5)*10, radius: 3, life: 15, type: 'smoke' });
        
        shotsUntilDrop--;
        if (shotsUntilDrop <= 0 && activeBoxes.length === 0) spawnBoxes();
    }

    function triggerExplosion(ex, ey, isSuper) {
        playExplosionSound(); 
        const radius = isSuper ? 60 : 30; 
        explosions.push({ x: ex, y: ey, radius: radius, life: 25, type: 'explosion' });
        
        let shooterName = players[currentPlayerIndex] ? players[currentPlayerIndex].name : "Fantasma";
        let killedSomeone = false;
        let maxDepth = canvas.height - 245; 

        for (let x = Math.floor(ex - radius); x <= Math.floor(ex + radius); x++) {
            if (x >= 0 && x < WORLD_W) {
                let dx = x - ex; let dy = Math.sqrt(radius * radius - dx * dx);
                terrain[x] = Math.max(terrain[x], ey + dy);
                if (terrain[x] > maxDepth) terrain[x] = maxDepth;
            }
        }

        players.forEach(p => {
            if (p && p.alive) {
                let dist = Math.hypot(p.x - ex, p.y - ey);
                if (dist <= radius + 5) {
                    p.alive = false; killedSomeone = true;
                    bloodPuddles.push({ x: p.x });
                    
                    dyingPlayers.push({ x: p.x, y: p.y, killer: shooterName, life: 120 });
                    
                    showDramaticMessage(`${shooterName}\nELIMINOU\n${p.name}!`, '#ff3333');
                    for(let i=0; i<8; i++) explosions.push({ x: p.x, y: p.y - 10, radius: 4, life: 20, type: 'smoke' });
                }
            }
        });

        if (!players[currentPlayerIndex].alive) actionsLeft = 0; 

        let delay = 1000;
        if (killedSomeone) delay = 5000; 
        else {
            let hasTaunt = triggerMissTaunt(ex, ey, shooterName);
            if(hasTaunt) delay = 4000; 
        }

        checkWinCondition();
        if (gameState === 'PLAYING') setTimeout(finishAction, delay); 
    }

    function finishAction() {
        if (gameState !== 'PLAYING') return;
        
        actionsLeft--; updateStatusText();

        if (actionsLeft <= 0) nextTurn(); 
        else {
            actionInProgress = false;
            let p = players[currentPlayerIndex];
            cameraX = (p.x < SCREEN_W) ? 0 : 400;
            if (players[currentPlayerIndex].team === 1) setTimeout(botAI, 800);
        }
    }

    function nextTurn() {
        if (gameState !== 'PLAYING') return;
        let loopGuard = 0, found = false;
        while (loopGuard < 6) {
            currentPlayerIndex = (currentPlayerIndex + 1) % 6;
            if (players[currentPlayerIndex] && players[currentPlayerIndex].alive) { found = true; break; }
            loopGuard++;
        }
        if (found) startPlayerTurn();
        else checkWinCondition();
    }

    function botAI() {
        if (gameState !== 'PLAYING' || actionInProgress || actionsLeft <= 0) return;
        
        let bot = players[currentPlayerIndex];

        let myBoxes = activeBoxes.filter(b => b.x >= 400 && b.x <= WORLD_W);
        if (myBoxes.length > 0) {
            let targetBox = myBoxes.sort((a,b) => Math.abs(a.x - bot.x) - Math.abs(b.x - bot.x))[0];
            let distToBox = targetBox.x - bot.x;
            if (Math.abs(distToBox) > 10) {
                executeJump(distToBox > 0 ? 1 : -1);
                return;
            }
        }

        let targets = players.filter(p => p && p.team === 0 && p.alive);
        if (targets.length === 0) return;
        
        targets.sort((a, b) => Math.abs(a.x - bot.x) - Math.abs(b.x - bot.x));
        let target = targets[0];
        
        if (actionsLeft >= 2 && Math.random() < 0.3 && myBoxes.length === 0) {
            let dist = target.x - bot.x; let dir = dist > 0 ? 1 : -1;
            if (Math.abs(dist) < 100) dir *= -1; 
            executeJump(dir);
        } else {
            let dist = target.x - bot.x; let time = 60 + (Math.random() * 10); 
            let vx = dist / time; let vy = (target.y - bot.y - 0.5 * 0.15 * time * time) / time;
            vx += (Math.random() - 0.5) * 0.5; vy += (Math.random() - 0.5) * 0.5;
            executeShoot(vx, vy, 0, 0);
        }
    }

    function initVictoryBots(team) {
        let winners = players.filter(p => p && p.team === team);
        let startX = cameraX + 100;
        let spacing = 100; 
        victoryBots = winners.map((p, i) => {
            let bx = startX + i * spacing;
            let gy = terrain[Math.floor(bx)] || (canvas.height - 100);
            return { name: p.name, team: p.team, isGhost: !p.alive, x: bx, y: gy, groundY: gy, vy: 0 };
        });
    }

    function checkWinCondition() {
        let friendsAlive = players.filter(p => p && p.team === 0 && p.alive).length;
        let botsAlive = players.filter(p => p && p.team === 1 && p.alive).length;
        
        if (gameState === 'GAME_OVER') return;

        if (botsAlive === 0 && friendsAlive > 0) { 
            gameState = 'GAME_OVER'; 
            actionArea.style.display = 'none'; joystickZone.style.display = 'none';
            playVictorySound(); initVictoryBots(0);
            
            let vencedores = players.filter(p => p && p.team === 0).map(p => p.name).join('<br>');
            centerModal.style.display = 'flex';
            modalText.innerHTML = `<span style="color:#aaffaa; font-size: 20px;">🏆 VITÓRIA!</span><br><br><span style="font-size: 14px;">Vencedores:</span><br><span style="color:#fff">${vencedores}</span>`;
            setTimeout(() => { showStartScreen(); }, 8000); 
        }
        else if (friendsAlive === 0 && botsAlive > 0) { 
            gameState = 'GAME_OVER'; 
            actionArea.style.display = 'none'; joystickZone.style.display = 'none';
            playVictorySound(); initVictoryBots(1);
            
            let vencedores = players.filter(p => p && p.team === 1).map(p => p.name).join('<br>');
            centerModal.style.display = 'flex';
            modalText.innerHTML = `<span style="color:#ff4444; font-size: 20px;">💀 DERROTA!</span><br><br><span style="font-size: 14px;">Vencedores:</span><br><span style="color:#fff">${vencedores}</span>`;
            setTimeout(() => { showStartScreen(); }, 8000); 
        }
    }

    function drawTerrainAt(x, y) {
        if (x < 0) x = 0; if (x > 399) x = 399; 
        terrain[x] = y; terrain[799 - x] = y; 
    }

    function drawTerrainLine(x1, y1, x2, y2) {
        let steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
        for (let i = 0; i <= steps; i++) drawTerrainAt(Math.floor(x1 + (x2 - x1) * (i / steps)), Math.floor(y1 + (y2 - y1) * (i / steps)));
    }

    requestAnimationFrame(gameLoop);

</script>
</body>
